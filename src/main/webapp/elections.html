<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elections - Online Voting System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <div id="nav-container"></div> <!-- Load nav here -->
    <div class="container mt-5">
        <h2>Active Elections</h2>
        <ul id="election-list" class="list-group"></ul>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Manually trigger nav population
        // In a real SPA we'd have a layout system, but here we just need to ensure nav is present.
        // Base.html isn't automatically included in static HTML unless we fetch it,
        // but simple copy-paste of nav structure via JS is easier here or just including nav in every page.
        // I'll update app.js to inject nav if a container exists.

        document.addEventListener('DOMContentLoaded', async () => {
           // Inject Nav
           const navContainer = document.getElementById('nav-container');
           navContainer.innerHTML = `
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <a class="navbar-brand" href="/">Voting System</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav mr-auto" id="nav-links"></ul>
                </div>
            </nav>`;
           await checkAuth();

           const response = await fetch('/api/elections');
           const elections = await response.json();
           const list = document.getElementById('election-list');

           elections.forEach(election => {
               const now = new Date();
               const start = new Date(election.startTime); // JSON key from Jackson
               const end = new Date(election.endTime);

               let action = '';
               if (now < start) {
                   action = '<span class="badge badge-warning">Coming Soon</span>';
               } else if (now > end) {
                   action = `<a href="/results.html?id=${election.id}" class="btn btn-secondary btn-sm">View Results</a>`;
               } else {
                   action = `<a href="/vote.html?id=${election.id}" class="btn btn-primary btn-sm">Vote</a>`;
               }

               list.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${election.name} (${start.toLocaleString()} - ${end.toLocaleString()})
                    ${action}
                </li>`;
           });
        });
    </script>
</body>
</html>
