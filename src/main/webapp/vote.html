<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vote - Online Voting System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div id="nav-container"></div>
    <div class="container mt-5">
        <h2>Cast Your Vote</h2>
        <form id="vote-form">
            <div class="form-group">
                <label>Select Candidate:</label>
                <select id="candidate-select" class="form-control" name="candidate_id" required>
                    <option value="">Loading candidates...</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Submit Vote</button>
        </form>
         <div id="message" class="mt-3"></div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
             const navContainer = document.getElementById('nav-container');
             navContainer.innerHTML = `
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <a class="navbar-brand" href="/">Voting System</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav mr-auto" id="nav-links"></ul>
                </div>
            </nav>`;
            await checkAuth();

            const params = new URLSearchParams(window.location.search);
            const electionId = params.get('id');
            if (!electionId) {
                alert('No election specified');
                window.location.href = '/elections.html';
                return;
            }

            const response = await fetch(`/api/candidates/${electionId}`);
            const candidates = await response.json();
            const select = document.getElementById('candidate-select');
            select.innerHTML = '<option value="">Select a candidate</option>';
            candidates.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });

            document.getElementById('vote-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const candidateId = select.value;
                const res = await fetch('/api/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        election_id: parseInt(electionId),
                        candidate_id: parseInt(candidateId)
                    })
                });

                const result = await res.json();
                const msgDiv = document.getElementById('message');
                msgDiv.innerText = result.message;
                if (res.ok) {
                    msgDiv.className = 'text-success mt-3';
                    setTimeout(() => window.location.href = '/elections.html', 2000);
                } else {
                    msgDiv.className = 'text-danger mt-3';
                }
            });
        });
    </script>
</body>
</html>
